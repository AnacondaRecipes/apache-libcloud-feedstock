{% set name = "apache-libcloud" %}
{% set version = "3.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/apache-libcloud-{{ version }}.tar.gz
  sha256: 75bf4c0b123bc225e24ca95fca1c35be30b19e6bb85feea781404d43c4276c91

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=75.3.0
    - wheel >=0.45.1
  run:
    - python
    - requests >=2.26.0
  run_constrained:
    - twine ==5.1.1

test:
  imports:
    - libcloud
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://libcloud.apache.org
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  license_family: Apache
  summary: Python library for interacting with many of the popular cloud service providers using a unified API
  description: |
    Apache Libcloud is a Python library which hides differences between different cloud provider APIs and 
    allows you to manage different cloud resources through a unified and easy to use API.
  doc_url: https://libcloud.readthedocs.io
  dev_url: https://github.com/apache/libcloud

extra:
  recipe-maintainers:
    - danielfrg
    - nmadhok
    - tonybaloney
